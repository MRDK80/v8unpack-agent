name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ci:
    name: verify CI for release commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful tests.yml on the same commit
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'tests.yml',
              head_sha: sha,
              status: 'completed',
              per_page: 100,
            });
            const passed = runs.data.workflow_runs.some(
              run => run.conclusion === 'success'
            );
            if (!passed) {
              core.setFailed(`No successful tests.yml run found for ${sha}`);
              return;
            }
            const main = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });
            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: sha,
              head: main.data.commit.sha,
            });
            if (!['identical', 'ahead'].includes(comparison.data.status)) {
              core.setFailed('Release commit is not reachable from main');
            }

  build:
    name: build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Validate release metadata
        run: python scripts/validate_release.py
      - name: Validate tag against version
        if: github.ref_type == 'tag'
        run: python scripts/validate_release.py --tag "${{ github.ref_name }}"
      - name: Build wheel and sdist once
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Upload immutable distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: install smoke / ${{ matrix.distribution }} / py${{ matrix.python-version }} / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        distribution: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install selected distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: >-
          python -c "import glob, os, subprocess, sys;
          pattern = 'dist/*.whl' if os.environ['DISTRIBUTION'] == 'wheel' else 'dist/*.tar.gz';
          files = glob.glob(pattern);
          assert len(files) == 1, files;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', files[0]])"
      - name: Verify import and CLI
        run: |
          python -c "import v8unpack_agent"
          v8unpack-agent-run --help
          python -m v8unpack_agent.cli --help
      - name: Run synthetic smoke and verify report
        run: |
          python -c "from pathlib import Path; Path('smoke-input').mkdir(exist_ok=True)"
          v8unpack-agent-run smoke-input --report-path smoke-report.json
          python -c "import json; from pathlib import Path; json.loads(Path('smoke-report.json').read_text(encoding='utf-8'))"

  publish:
    name: publish verified distributions
    needs: [verify-ci, build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
